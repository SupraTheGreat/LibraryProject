name: Docker Build Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-only:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # This step dynamically converts your username/repository to lowercase
      - name: Create Lowercase Repository Name Variable
        run: |
          echo "REPO_LOWERCASE=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false # Kept as false to only test and build the image locally
          tags: ghcr.io/${{ env.REPO_LOWERCASE }}/my-app:latest
